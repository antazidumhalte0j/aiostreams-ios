name: AIOStreams
options:
  bundleIdPrefix: io.github.aiostreams-ios
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Only for a build run from Xcode: scripts/make-ipa.sh sets both from the release tags.
    MARKETING_VERSION: "0.2.7"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # AetherEngine 7.74.0 with TrueHD Atmos and DTS:X heights and Dolby Vision FEL turned on.
  AetherEngineFeatures:
    path: Packages/AetherEngineFeatures
targets:
  AIOStreams:
    type: application
    platform: iOS
    sources:
      - path: AIOStreams/Sources
      - path: AIOStreams/Assets.xcassets
      # The app's own alerts and permission prompts, in the web app's languages.
      - path: AIOStreams/Localization
      # The web app's standalone build, copied in by scripts/build-web.sh, kept as a folder.
      - path: AIOStreams/Resources/web
        type: folder
        buildPhase: resources
    dependencies:
      - package: AetherEngineFeatures
        product: AetherEngineFeatures
    info:
      path: AIOStreams/Info.plist
      properties:
        CFBundleDisplayName: AIOStreams
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The languages the web app lists. On iOS, they're what lets the page's Automatic language
        # follow the system: a web view reports only the languages its app declares.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, de, el, es, fr, id, it, ms, pl, pt-BR, pt-PT, ro, tr, zh-Hans]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Resizable: Split View and Slide Over on iPad, and iPhone Duo's folding and Split View, where
        # an app that asks for the full screen is held in a fixed window.
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        # Playback keeps going with the screen off or the app in the background.
        UIBackgroundModes:
          - audio
        # Self-hosted servers, and many streams and live channels, are plain http, on the local
        # network or not. Only this key: with NSAllowsLocalNetworking (or the media or web content
        # ones) beside it, iOS and tvOS ignore it and allow plain http on the local network alone.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: AIOStreams connects to your server and streams on your local network.
        NSMicrophoneUsageDescription: Voice search in the page's search field uses the microphone.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.aiostreams-ios.link
            CFBundleURLSchemes:
              - aiostreams
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreams-ios.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  AIOStreamsTV:
    type: application
    platform: tvOS
    sources:
      - path: TV/Sources
      - path: TV/Assets.xcassets
      # The app's strings in the web app's languages, from scripts/localization/build.py.
      - path: TV/Localization
      # Inter, the web app's typeface (SIL Open Font License, TV/Fonts/OFL.txt).
      - path: TV/Fonts
        buildPhase: resources
      # Shared with the iOS app.
      - path: AIOStreams/Sources/Support.swift
      - path: AIOStreams/Sources/SubtitleOverlayView.swift
      - path: AIOStreams/Sources/YouTube.swift
      - path: TV/Shared
    dependencies:
      - package: AetherEngineFeatures
        product: AetherEngineFeatures
      # Continue watching and Next up on the Apple TV's home screen.
      - target: AIOStreamsTVTopShelf
        embed: true
    entitlements:
      path: TV/AIOStreamsTV.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.aiostreams-ios.tv]
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: AIOStreams
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, de, el, es, fr, id, it, ms, pl, pt-BR, pt-PT, ro, tr, zh-Hans]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
        # Self-hosted servers, and many streams and live channels, are plain http, on the local
        # network or not. Only this key: with NSAllowsLocalNetworking (or the media or web content
        # ones) beside it, iOS and tvOS ignore it and allow plain http on the local network alone.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: AIOStreams connects to your server and streams on your local network.
        # Top Shelf's links: a title's page, or playing it.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.aiostreams-ios.tv.link
            CFBundleURLSchemes:
              - aiostreams
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreams-ios.tv
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
  AIOStreamsTVTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: TV/TopShelf
        excludes: ["*.entitlements"]
      - path: TV/Shared
    entitlements:
      path: TV/TopShelf/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.aiostreams-ios.tv]
    info:
      path: TV/TopShelf/Info.plist
      properties:
        CFBundleDisplayName: AIOStreams Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreams-ios.tv.topshelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
